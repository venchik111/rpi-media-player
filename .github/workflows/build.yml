name: build

# Manual only: each run takes 1.5-3 h of Actions minutes on a private repo.
on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/work/dl
            ${{ runner.temp }}/work/ccache
          key: br-${{ hashFiles('br2-external/configs/*', '.gitmodules') }}-${{ github.sha }}
          restore-keys: br-

      - name: Builder image
        run: docker build -t rpi-player-builder docker/

      - name: Prepare
        run: |
          mkdir -p "$RUNNER_TEMP/work" && sudo chown 1000:1000 "$RUNNER_TEMP/work"
          sudo chmod a+rwx .
          echo "RUN=docker run --rm -v $PWD:/src -v $RUNNER_TEMP/work:/work -w /src rpi-player-builder" >> "$GITHUB_ENV"

      - name: Build QEMU kernel (test twin)
        run: $RUN scripts/build.sh qemu

      - name: Build Raspberry Pi image
        run: $RUN scripts/build.sh rpi4

      - name: Audit SD image
        run: $RUN scripts/test.sh audit

      - name: Boot on QEMU raspi4b
        run: $RUN scripts/test.sh boot

      - name: End-to-end tests (Pi rootfs on QEMU virt + simulated Wi-Fi)
        run: $RUN scripts/test.sh e2e

      - name: Compress image
        if: always()
        run: test -f out/rpi4/sdcard.img && xz -T0 -6 -k out/rpi4/sdcard.img || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpi4-sdcard
          path: out/rpi4/sdcard.img.xz
          if-no-files-found: ignore
