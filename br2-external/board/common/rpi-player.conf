# rpi-media-player configuration.
# On the Pi this file lives on the FAT "BOOT" partition: edit it from any PC.
# Shell syntax: KEY="value". Applied at every boot.

# ---- Wi-Fi access point ----
AP_SSID="rpi-cam"
# WPA2 passphrase, 8..63 chars. Empty = open network.
AP_PASSPHRASE="camera1234"
AP_COUNTRY="RU"
# hw mode: g = 2.4 GHz, a = 5 GHz
AP_HW_MODE="g"
AP_CHANNEL="6"
AP_HIDDEN="0"
AP_ADDR="192.168.50.1"
AP_PREFIX="24"
AP_DHCP_START="192.168.50.10"
AP_DHCP_END="192.168.50.100"

# ---- Wired port: DHCP client (handy for SSH while debugging) ----
ETH0_DHCP="yes"

# ---- HLS stream: http://<AP_ADDR>:<HLS_PORT>/stream.m3u8 ----
HLS_PORT="8080"
HLS_SEGMENT_SECONDS="2"
HLS_LIST_SIZE="6"
# File to play, relative to /data/media. Empty = newest uploaded video.
MEDIA_FILE=""

# ---- Accounts (SSH/SFTP). Empty = keep the current password. ----
ROOT_PASSWORD="player"
MEDIA_PASSWORD="media"

